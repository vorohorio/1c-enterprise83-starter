name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper lintian desktop-file-utils libxml2-utils

      - name: Validate data files
        run: |
          # servicemenus/ — формат KDE (Type=Service), этот валидатор его не знает
          desktop-file-validate data/applications/*.desktop
          xmllint --noout data/mime/1cd-starter.xml

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../*.deb dist/

      - name: Lintian
        run: lintian --info dist/*.deb || true

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
          generate_release_notes: true
